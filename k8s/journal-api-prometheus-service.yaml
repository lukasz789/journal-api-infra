apiVersion: v1
kind: Service
metadata:
  name: journal-api-metrics
  namespace: journal-api
  # The Prometheus ServiceMonitor uses these labels to find the metrics endpoint.
  labels:
    app: journal-api
    component: metrics
spec:
  # Internal access only; this does not create a public load balancer.
  type: ClusterIP
  # Route metrics traffic to Pods labeled app: journal-api (defined in deployment.yaml).
  selector:
    app: journal-api
  ports:
    - name: metrics
      port: 9464
      # Refers to the named container port "metrics" (9464) in deployment.yaml.
      targetPort: metrics
