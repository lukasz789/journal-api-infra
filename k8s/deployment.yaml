apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  namespace: journal-api
spec:
  # Keep two copies of the API running so one Pod can be replaced without downtime.
  replicas: 2
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      containers:
        - name: journal-api
          # The deploy job will replace this with the ECR image tagged with the commit SHA.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            # Internal endpoint scraped by Prometheus; it is not exposed publicly.
            - name: metrics
              containerPort: 9464

          # Load DATABASE_URL and OPENAI_API_KEY from the Kubernetes Secret.
          envFrom:
            - secretRef:
                name: journal-api-secrets

          env:
            # Send LLM requests to Amazon Bedrock instead of the Python defaults.
            # The Bedrock API key comes from journal-api-secrets above.
            - name: OPENAI_BASE_URL
              value: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
            - name: OPENAI_MODEL
              value: openai.gpt-oss-20b-1:0

            # The app already creates traces in api/telemetry.py. This variable
            # tells it where to send them: the CloudWatch Agent Service in the
            # amazon-cloudwatch namespace, over HTTP on port 4316.
            # The agent sends them onward to X-Ray over HTTPS on port 443 using
            # its IAM role; Journal API does not need AWS credentials for this.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://cloudwatch-agent.amazon-cloudwatch:4316/v1/traces

            # The agent runs on every worker and listens on that worker's IP.
            # Send metrics to the agent on this Pod's worker using its private IP.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: http://$(NODE_IP):4318/v1/metrics
            # Each report covers only the time since the previous report.
            # Earlier requests were already reported and must not be counted again.
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: DELTA

          # Do not send traffic to the Pod until the API responds successfully.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # Restart the container if the API stops responding.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          # A t3.small has 2 vCPU and 2 GiB RAM, but application Pods cannot use all of it.
          # The OS, kubelet and EKS add-ons such as aws-node, kube-proxy and Pod Identity Agent
          # also consume resources on each node.
          # https://docs.aws.amazon.com/eks/latest/best-practices/node_and_workload_efficiency.html
          # -> memory is most dangerous since with too low CPU application will be slow but still work, while with too low memory the Pod will be killed
          resources:
            requests:
              cpu: 100m # 0.1 vCPU
              memory: 128Mi # 128 MB
            limits:
              cpu: 500m
              memory: 512Mi
