<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="980" viewBox="0 0 1080 980" role="img" aria-labelledby="title desc">
<title id="title">Journal API on AWS — General architecture</title>
<desc id="desc">Logical AWS architecture. The client reaches the API through the Internet Gateway and a public Classic Load Balancer. Two private EKS workers host two API Pods, which connect to Single-AZ RDS and reach Bedrock through one shared NAT Gateway. The AWS-managed EKS control plane manages the private workers separately from application traffic. Each subnet tier spans two Availability Zones; exact Pod and database placement is not fixed.</desc>
