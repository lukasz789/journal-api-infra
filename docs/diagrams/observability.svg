<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="710" viewBox="0 0 1080 710" role="img" aria-labelledby="title desc">
<title id="title">Journal API telemetry</title>
<desc id="desc">Application and infrastructure metrics through Prometheus to Grafana; HTTP metrics through CloudWatch Agent to CloudWatch Metrics; spans through the same agent to X-Ray; container stdout and stderr through Fluent Bit to CloudWatch Logs. Prometheus initiates scrapes, and Grafana queries stored metrics. Trace identifiers correlate X-Ray traces and CloudWatch logs.</desc>
