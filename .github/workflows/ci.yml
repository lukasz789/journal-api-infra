name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_journal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal
      # Required by api.config.Settings so the app boots. Tests never call a
      # real LLM — Task 4 uses an injected MockAsyncOpenAI client — so any
      # non-empty value works.
      OPENAI_API_KEY: ci-placeholder-not-used-by-mock

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql \
            -h localhost -U postgres -d career_journal \
            -f database_setup.sql

      - name: Run tests
        run: uv run pytest -v

  # TODO - delete GitHub Container Registry (ghcr.io) later.
  build-and-push:
    name: Build and push
    # Pull requests only verify the code. Images are published after a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Allows to fetch OIDC token which is used to assume the IAM role in AWS without storing AWS access keys in GitHub.
      id-token: write
      # Needed only to push the Docker image to GitHub Container Registry (ghcr.io).
      # This is something OPTIONAL since I use ECR anyway.
      packages: write

    steps:
      # Checkouts the code from commit that triggered this workflow.
      - uses: actions/checkout@v4

      # OIDC lets this job assume the IAM role without storing AWS access keys in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # GITHUB_TOKEN is created automatically for this workflow run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build once and publish the same image under all required registry tags.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
            ghcr.io/lukasz789/journal-api:latest

  deploy:
    name: Deploy to EKS
    # Deploy only the image built from a push to the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to assume the AWS IAM role through GitHub OIDC.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Add the EKS API endpoint and authentication command to kubeconfig.
      - name: Configure kubectl
        run: >-
          aws eks update-kubeconfig
          --region "${{ vars.AWS_REGION }}"
          --name "${{ vars.EKS_CLUSTER_NAME }}"

      # The CI/CD role is intentionally limited to the existing journal-api namespace.
      # Apply k8s/namespace.yaml once with an administrator before the first deployment.
      - name: Verify namespace exists
        run: kubectl get namespace journal-api

      # Read the RDS password from AWS Secrets Manager and create the Kubernetes Secret.
      - name: Apply application secrets
        env:
          RDS_HOST: ${{ vars.RDS_HOST }}
          RDS_DATABASE_NAME: ${{ vars.RDS_DATABASE_NAME }}
          RDS_MASTER_USER_SECRET_ARN: ${{ vars.RDS_MASTER_USER_SECRET_ARN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "${RDS_HOST}" || { echo "RDS_HOST GitHub Variable is missing."; exit 1; }
          test -n "${RDS_DATABASE_NAME}" || { echo "RDS_DATABASE_NAME GitHub Variable is missing."; exit 1; }
          test -n "${RDS_MASTER_USER_SECRET_ARN}" || { echo "RDS_MASTER_USER_SECRET_ARN GitHub Variable is missing."; exit 1; }
          test -n "${OPENAI_API_KEY}" || { echo "OPENAI_API_KEY GitHub Secret is missing."; exit 1; }

          RDS_SECRET_JSON="$(
            aws secretsmanager get-secret-value \
              --secret-id "${RDS_MASTER_USER_SECRET_ARN}" \
              --query SecretString \
              --output text
          )"

          # `@uri` safely encodes special characters which can occur in credentials.
          RDS_USERNAME="$(printf '%s' "${RDS_SECRET_JSON}" | jq --raw-output '.username | @uri')"
          RDS_PASSWORD="$(printf '%s' "${RDS_SECRET_JSON}" | jq --raw-output '.password | @uri')"

          DATABASE_URL="postgresql://${RDS_USERNAME}:${RDS_PASSWORD}@${RDS_HOST}:5432/${RDS_DATABASE_NAME}?sslmode=require"

          # `create --dry-run` generates the Secret manifest without creating it directly.
          # Piping it to `apply` creates the Secret or updates it if it already exists.
          kubectl --namespace journal-api create secret generic journal-api-secrets \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY}" \
            --dry-run=client \
            --output=yaml \
            | kubectl apply --filename=-

      # Replace the manifest placeholder with the immutable image tag from this commit.
      - name: Apply deployment
        env:
          IMAGE_URI: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|" k8s/deployment.yaml \
            | kubectl apply --filename=-

      # Creating a LoadBalancer Service asks AWS to provision the public load balancer.
      - name: Apply service
        run: kubectl apply --filename=k8s/service.yaml

      - name: Wait for deployment
        run: >-
          kubectl --namespace journal-api rollout status
          deployment/journal-api
          --timeout=5m

      # The AWS load balancer can take a few minutes to receive its public hostname.
      - name: Wait for load balancer
        run: |
          for attempt in {1..30}; do
            LOAD_BALANCER_HOSTNAME="$(
              kubectl --namespace journal-api get service journal-api \
                --output=jsonpath='{.status.loadBalancer.ingress[0].hostname}'
            )"

            if [ -n "${LOAD_BALANCER_HOSTNAME}" ]; then
              echo "Load balancer hostname: ${LOAD_BALANCER_HOSTNAME}"
              exit 0
            fi

            echo "Waiting for the load balancer hostname..."
            sleep 10
          done

          echo "The load balancer did not receive a hostname within 5 minutes."
          exit 1

      - name: Verify health endpoint
        run: |
          LOAD_BALANCER_HOSTNAME="$(
            kubectl --namespace journal-api get service journal-api \
              --output=jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          )"

          curl --fail --retry 20 --retry-all-errors --retry-delay 10 \
            "http://${LOAD_BALANCER_HOSTNAME}/health"
